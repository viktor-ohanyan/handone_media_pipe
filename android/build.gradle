group = "dev.ohanyan.handone_media_pipe"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.0.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 9 enables built-in Kotlin, so the kotlin-android plugin is no longer applied.
apply plugin: "com.android.library"

android {
    namespace = "dev.ohanyan.handone_media_pipe"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // With built-in Kotlin, src/main/kotlin and src/test/kotlin are default
    // Kotlin source directories, so no explicit sourceSets configuration is needed.

    defaultConfig {
        minSdk = 24
        consumerProguardFiles("proguard-rules.pro")
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

// With built-in Kotlin, Kotlin compiler options move to the top-level kotlin { } block.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Using CameraX 1.4.0+ which has better support for ImplementationMode
    implementation "androidx.camera:camera-core:1.4.0"
    implementation "androidx.camera:camera-camera2:1.4.0"
    implementation "androidx.camera:camera-lifecycle:1.4.0"
    implementation "androidx.camera:camera-view:1.4.0"
    // MediaPipe Tasks Vision for Hand and Pose landmarkers
    implementation "com.google.mediapipe:tasks-vision:0.10.33"
}
